name: Build Bear 3.14.1
on:
  push:
    branches: [bear-3.14.1]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install pyelftools polib regex
          python utils/bootstrap.py
      - name: Configure
        run: |
          cmake -S . -B build-bear -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/AvrGcc.cmake \
            '-DFW_VARIANTS=MK3S_BEAR_STOCK;MK3S_BEAR_EXXA_V1;MK3S_BEAR_EXXA_V2'
      - name: Compile all three variants
        run: |
          cmake --build build-bear --parallel 2 --target \
            MK3S_BEAR_STOCK_ENGLISH MK3S_BEAR_STOCK_MULTILANG \
            MK3S_BEAR_EXXA_V1_ENGLISH MK3S_BEAR_EXXA_V1_MULTILANG \
            MK3S_BEAR_EXXA_V2_ENGLISH MK3S_BEAR_EXXA_V2_MULTILANG
      - uses: actions/upload-artifact@v4
        with:
          name: bear-3.14.1-firmware
          path: build-bear/*.hex
          if-no-files-found: error
      - name: Package and publish firmware ZIPs
        if: github.ref == 'refs/heads/bear-3.14.1'
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          import zipfile
          
          output = Path("firmware-zips")
          output.mkdir(exist_ok=True)
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          variants = ["STOCK", "EXXA_V1", "EXXA_V2"]
          for variant in variants:
              prefix = "MK3S_BEAR_" + variant
              archive_path = output / ("Prusa-Bear-3.14.1-" + variant + ".zip")
              with zipfile.ZipFile(archive_path, "w", zipfile.ZIP_DEFLATED) as archive:
                  for language in ["ENGLISH", "MULTILANG"]:
                      matches = list(Path("build-bear").glob("*BEAR_" + variant + "_FW_3.14.1_" + language + ".hex"))
                      if len(matches) != 1:
                          raise RuntimeError(f"Expected one {variant} {language} binary, got {matches}")
                      archive.write(matches[0], prefix + "_" + language + ".hex")
                  archive.write("README.md", "README.md")
                  archive.write("LICENSE", "LICENSE")
                  archive.writestr("BUILD.json", json.dumps({
                      "source_commit": commit,
                      "variant": prefix,
                      "hardware_tested": False
                  }, indent=2) + "\n")
              with zipfile.ZipFile(archive_path) as archive:
                  if archive.testzip() is not None:
                      raise RuntimeError(f"Corrupt archive {archive_path}")
          
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          with zipfile.ZipFile(output / "Prusa-Bear-3.14.1-source.zip", "w", zipfile.ZIP_DEFLATED) as archive:
              for name in tracked:
                  if name and not name.startswith("firmware-zips/"):
                      archive.write(name, "Prusa-Bear-Firmware/" + name)
              archive.writestr("Prusa-Bear-Firmware/SOURCE_COMMIT.txt", commit + "\n")
          checksums = []
          for path in sorted(output.glob("*.zip")):
              checksums.append(hashlib.sha256(path.read_bytes()).hexdigest() + "  " + path.name)
          (output / "SHA256SUMS").write_text("\n".join(checksums) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware-zips
          git commit -m "Publish firmware ZIPs and source archive [skip ci]"
          git push origin HEAD:bear-3.14.1
